[project]
name = "research-prompt-forge"
version = "0.0.1"
description = "Rewrite one general research prompt into per-engine optimized prompts with explanation memos."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
forge = "forge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
