[project]
name = "polyprompt"
version = "0.8.0"
description = "Rewrite one general research prompt into per-engine optimized prompts with explanation memos."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polyprompt = "polyprompt.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyprompt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
